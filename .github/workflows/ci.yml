name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - name: Install
        run: yarn install --frozen-lockfile --check-files
      - name: Build
        run: yarn build
        env:
          # Source maps upload is optional; CI only needs a clean compile.
          SENTRY_AUTH_TOKEN: ''
